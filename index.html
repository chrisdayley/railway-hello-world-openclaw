<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><meta name='theme-color' content='#14251e'><link rel='manifest' href='manifest.webmanifest'><title>Everlight: Vale of Echoes</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#09120f;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block;background:#274b36;image-rendering:pixelated}.hud{position:fixed;inset:0;pointer-events:none}.panel{position:absolute;background:#07110edb;border:1px solid #9bc49c;border-radius:9px;padding:8px;font-size:12px;box-shadow:0 4px 18px #0008}.stats{top:max(8px,env(safe-area-inset-top));left:8px}.quest{top:max(8px,env(safe-area-inset-top));right:8px;max-width:46vw;text-align:right}.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:#000e;padding:9px 14px;border-radius:8px;opacity:0;transition:opacity .2s}.joy{position:absolute;left:20px;bottom:max(22px,env(safe-area-inset-bottom));width:96px;height:96px;border:2px solid #ffffff44;border-radius:50%;background:#ffffff10;pointer-events:auto}.knob{position:absolute;left:30px;top:30px;width:36px;height:36px;border-radius:50%;background:#ffffff66}.b{position:absolute;width:62px;height:62px;border-radius:50%;border:2px solid #a7d5a8;background:#17332de8;color:#fff;font-weight:800;pointer-events:auto}.atk{right:22px;bottom:27px}.use{right:94px;bottom:16px}.dash{right:91px;bottom:88px}.menu{right:18px;top:92px;width:48px;height:48px;font-size:11px}.overlay{position:fixed;inset:0;background:#07110ef2;z-index:10;display:none;overflow:auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));box-sizing:border-box}.overlay.open{display:block}.card{max-width:680px;margin:0 auto;background:#10231d;border:1px solid #9bc49c;border-radius:14px;padding:16px}.card h1,.card h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice,.smallbtn{background:#1b3b31;color:#fff;border:1px solid #a7d5a8;border-radius:10px;padding:12px;font-weight:700}.smallbtn{padding:8px 10px;font-size:12px}.locked{opacity:.45}.rar-Common{color:#ddd}.rar-Uncommon{color:#9fe0a0}.rar-Rare{color:#78c6ff}.rar-Epic{color:#d896ff}.rar-Legendary{color:#ffd36f}.rar-Mythic{color:#ff8ca6}.start{position:fixed;inset:0;background:linear-gradient(#0c1914,#18392c);display:grid;place-items:center;z-index:20}.startbox{text-align:center;padding:24px}.start button{font-size:23px;padding:17px 28px;border-radius:12px;border:2px solid #e8d790;background:#284e3e;color:#fff;font-weight:800}.sub{opacity:.8;font-size:13px;max-width:420px;margin:10px auto 20px}.bar{width:140px;height:8px;background:#0008;border-radius:5px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#d9e6bc}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18;padding:8px 0}.muted{opacity:.7;font-size:12px}
</style></head><body>
<div class='start' id='start'><div class='startbox'><h1>EVERLIGHT</h1><div>Vale of Echoes</div><p class='sub'>A solo high-fantasy action RPG prototype. Explore, uncover secrets, choose factions, recruit companions, and build your own combat style.</p><button id='startBtn'>START ADVENTURE</button></div></div>
<canvas id='g' width='960' height='540'></canvas><div class='hud'><div class='panel stats' id='stats'></div><div class='panel quest' id='quest'></div><div class='toast' id='toast'></div><div class='joy' id='joy'><div class='knob' id='knob'></div></div><button class='b atk' id='atk'>ATTACK</button><button class='b use' id='use'>USE</button><button class='b dash' id='dash'>DODGE</button><button class='b menu' id='menu'>MENU</button></div>
<div class='overlay' id='charOverlay'><div class='card'><h2>Create your adventurer</h2><p class='muted'>This only affects your starting specialty. All combat paths remain viable later.</p><div class='grid'><button class='choice' data-style='vanguard'>Vanguard<br><span class='muted'>+15 HP, stronger melee</span></button><button class='choice' data-style='ranger'>Ranger<br><span class='muted'>faster attacks, +crit</span></button><button class='choice' data-style='arcanist'>Arcanist<br><span class='muted'>more mana, stronger abilities</span></button><button class='choice' data-style='wanderer'>Wanderer<br><span class='muted'>balanced, +luck</span></button></div></div></div>
<div class='overlay' id='menuOverlay'><div class='card'><h2>Adventurer</h2><div id='menuBody'></div><p><button class='smallbtn' id='closeMenu'>Return to game</button></p></div></div>
<script>
const c=document.getElementById('g'),ctx=c.getContext('2d');
const RAR=['Common','Uncommon','Rare','Epic','Legendary','Mythic'];
const rarityColor={Common:'#ddd',Uncommon:'#9fe0a0',Rare:'#78c6ff',Epic:'#d896ff',Legendary:'#ffd36f',Mythic:'#ff8ca6'};
const zones=[{name:'Greenwake Vale',x0:0,x1:900,color:'#598653'},{name:'Briarwatch',x0:900,x1:1450,color:'#778262'},{name:'Moonfall Ruins',x0:1450,x1:2250,color:'#59616f'},{name:'Skyreach Pass',x0:2250,x1:3000,color:'#485c65'}];
const newGame=()=>({x:170,y:270,hp:100,maxHp:100,mana:60,maxMana:60,stam:100,maxStam:100,gold:20,xp:0,level:1,style:null,atk:12,def:2,crit:.05,luck:0,quest:0,secret:false,boss1:false,boss2:false,mira:false,miraBond:0,faction:null,factionRep:{Ironbound:0,Archive:0},waystones:['Greenwake'],mount:false,mountLevel:0,airshipParts:0,loot:[],equipped:{weapon:null,armor:null},upgrades:0,lastShrine:{x:170,y:270},playTime:0});
let S=load()||newGame(),jx=0,jy=0,last=performance.now(),toastT=0,attackCd=0,dodgeCd=0,spawnT=0;
const enemies=[]; const bosses=[{id:'warden',name:'Hollow Warden',x:1820,y:270,hp:320,max:320,alive:true,phase:1},{id:'stag',name:'Glasshorn Stag',x:2650,y:170,hp:520,max:520,alive:true,phase:1}];
function load(){try{return JSON.parse(localStorage.getItem('everlight-save-v2'))}catch(e){return null}}
function save(){localStorage.setItem('everlight-save-v2',JSON.stringify(S))}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.style.opacity=1;toastT=2.4}
function rarityRoll(bonus=0){let r=Math.random()-bonus-S.luck*.002;return r<.012?'Mythic':r<.045?'Legendary':r<.12?'Epic':r<.30?'Rare':r<.62?'Uncommon':'Common'}
function makeLoot(source='enemy',bonus=0){const rar=rarityRoll(bonus),slot=Math.random()<.58?'weapon':'armor';const tier=RAR.indexOf(rar);let item={id:Date.now()+Math.random(),rar,slot,level:Math.max(1,S.level+Math.floor(Math.random()*3)-1),upgrade:0};item.name=(slot==='weapon'?['Vale Sword','Moonbow','Runeblade','Ash Spear'][Math.floor(Math.random()*4)]:['Traveler Coat','Briar Mail','Moonplate','Warden Mantle'][Math.floor(Math.random()*4)]);item.power=(slot==='weapon'?4:3)+tier*3+item.level*2;item.affix=['Swift','Stalwart','Lucky','Arcane','Vicious'][Math.floor(Math.random()*5)];if(source==='boss')item.power+=4;S.loot.push(item);toast(rar+' '+item.name+' found!');return item}
function equip(i){const it=S.loot[i];if(!it)return;S.equipped[it.slot]=it;toast('Equipped '+it.name);save();renderMenu()}
function upgrade(i){const it=S.loot[i];if(!it)return;const cost=20+it.upgrade*20;if(S.gold<cost){toast('Not enough gold');return}S.gold-=cost;it.upgrade++;it.power+=2;S.upgrades++;toast(it.name+' upgraded to +'+it.upgrade);save();renderMenu()}
function statsCalc(){let a=S.atk,d=S.def;if(S.equipped.weapon)a+=S.equipped.weapon.power;if(S.equipped.armor)d+=S.equipped.armor.power;return{a,d}}
function xpGain(n){S.xp+=n;let need=S.level*55;while(S.xp>=need){S.xp-=need;S.level++;S.maxHp+=8;S.hp=S.maxHp;S.maxMana+=4;S.atk+=2;toast('LEVEL '+S.level+'!');need=S.level*55}save()}
function spawnEnemy(x,y,type='briar'){enemies.push({x,y,hp:type==='knight'?75:38,max:type==='knight'?75:38,type,alive:true,hitT:0})}
function populate(){if(enemies.length)return;[[410,160],[520,360],[760,210],[1180,390],[1370,155],[1550,400],[1660,120],[2050,360],[2380,320],[2490,110]].forEach((p,i)=>spawnEnemy(p[0],p[1],i>6?'knight':'briar'))}
populate();
function hit(){if(attackCd>0)return;attackCd=.33;const st=statsCalc(),range=S.style==='ranger'?105:62;let damaged=false;for(const e of enemies){if(e.alive&&Math.hypot(S.x-e.x,S.y-e.y)<range){let dmg=st.a+(Math.random()<S.crit?st.a:0);e.hp-=dmg;e.hitT=.12;damaged=true;if(e.hp<=0){e.alive=false;S.gold+=4+Math.floor(Math.random()*6);xpGain(e.type==='knight'?20:10);if(Math.random()<.42)makeLoot('enemy',e.type==='knight'?.015:0)}}}for(const b of bosses){if(b.alive&&Math.hypot(S.x-b.x,S.y-b.y)<range+15){let dmg=st.a+(Math.random()<S.crit?st.a:0);b.hp-=dmg;damaged=true;if(b.hp<b.max*.5)b.phase=2;if(b.hp<=0){b.alive=false;if(b.id==='warden'){S.boss1=true;S.quest=Math.max(S.quest,5);S.gold+=90;makeLoot('boss',.08);toast('HOLLOW WARDEN DEFEATED');S.airshipParts++}else{S.boss2=true;S.gold+=150;makeLoot('boss',.12);makeLoot('boss',.06);toast('SECRET BOSS DEFEATED — GLASSHORN CREST CLAIMED')}}}}if(!damaged&&S.style==='arcanist'&&S.mana>=8){S.mana-=8;for(const e of enemies){if(e.alive&&Math.hypot(S.x-e.x,S.y-e.y)<145){e.hp-=8;e.hitT=.1}}}save()}
function interact(){if(Math.hypot(S.x-1040,S.y-270)<75&&!S.mira){S.mira=true;S.miraBond=1;S.quest=Math.max(S.quest,2);toast('Mira joined your party');save();return}if(Math.hypot(S.x-615,S.y-430)<65&&!S.secret){S.secret=true;S.gold+=45;makeLoot('secret',.08);toast('Secret chamber discovered!');save();return}if(Math.hypot(S.x-1320,S.y-110)<65&&!S.waystones.includes('Briarwatch')){S.waystones.push('Briarwatch');S.lastShrine={x:1320,y:150};toast('Briarwatch Waystone activated');save();return}if(Math.hypot(S.x-2220,S.y-390)<65&&!S.waystones.includes('Moonfall')){S.waystones.push('Moonfall');S.lastShrine={x:2220,y:350};toast('Moonfall Waystone activated');save();return}if(Math.hypot(S.x-1210,S.y-270)<70&&S.faction===null){openFaction();return}if(Math.hypot(S.x-1470,S.y-95)<70&&!S.mount&&S.gold>=120){S.gold-=120;S.mount=true;toast('Windstrider mount acquired!');save();return}if(Math.hypot(S.x-2860,S.y-270)<85){if(S.airshipParts>=3)toast('The Skyship frame hums to life. Flight system coming next.');else toast('Skyship requires 3 Aether Parts. You have '+S.airshipParts+'.');return}if(S.quest===0&&S.x>650){S.quest=1;toast('Quest updated: Reach Briarwatch');save()}}
function openFaction(){const o=document.getElementById('menuOverlay');o.classList.add('open');document.getElementById('menuBody').innerHTML=`<h3>Choose an allegiance</h3><p>Your first major commitment locks out its rival.</p><div class='grid'><button class='choice' onclick="joinFaction('Ironbound')">Ironbound Wardens<br><span class='muted'>combat, counters, heavy gear</span></button><button class='choice' onclick="joinFaction('Archive')">Veiled Archive<br><span class='muted'>secrets, relics, treasure sense</span></button></div>`}
window.joinFaction=function(name){S.faction=name;S.factionRep[name]=1;S.quest=Math.max(S.quest,3);if(name==='Ironbound'){S.maxHp+=10;S.hp=S.maxHp;S.def+=2;toast('Joined the Ironbound Wardens')}else{S.luck+=2;S.mana+=10;S.maxMana+=10;toast('Joined the Veiled Archive')}save();document.getElementById('menuOverlay').classList.remove('open')}
function factionProgress(){if(!S.faction)return;if(S.boss1&&S.factionRep[S.faction]<2){S.factionRep[S.faction]=2;if(S.faction==='Ironbound'){S.atk+=3;toast('Ironbound rank: Shieldbearer — +3 Attack')}else{S.luck+=2;toast('Archive rank: Seeker — Treasure luck increased')}save()}}
function fastTravel(name){if(name==='Greenwake'){S.x=170;S.y=270}else if(name==='Briarwatch'){S.x=1320;S.y=160}else if(name==='Moonfall'){S.x=2200;S.y=350}document.getElementById('menuOverlay').classList.remove('open');toast('Fast traveled to '+name)}
function renderMenu(){const body=document.getElementById('menuBody');const st=statsCalc();let eq=`<h3>Build</h3><div class='row'><span>Level ${S.level} · Attack ${st.a} · Defense ${st.d}</span><span>${S.gold}g</span></div><div class='row'><span>Faction</span><span>${S.faction||'Unaffiliated'}</span></div><div class='row'><span>Mount</span><span>${S.mount?'Windstrider Lv.'+(S.mountLevel+1):'None'}</span></div>`;let ft=`<h3>Fast Travel</h3><div class='grid'>${S.waystones.map(w=>`<button class='smallbtn' onclick="fastTravel('${w}')">${w}</button>`).join('')}</div>`;let inv=`<h3>Gear</h3>${S.loot.length?S.loot.map((it,i)=>`<div class='row'><span class='rar-${it.rar}'><b>${it.rar}</b> ${it.affix} ${it.name} +${it.upgrade}<br><span class='muted'>${it.slot} · power ${it.power}</span></span><span><button class='smallbtn' onclick='equip(${i})'>Equip</button> <button class='smallbtn' onclick='upgrade(${i})'>Upgrade</button></span></div>`).join(''):'<p class="muted">No gear yet.</p>'}`;body.innerHTML=eq+ft+inv}
window.fastTravel=fastTravel;window.equip=equip;window.upgrade=upgrade;
function openMenu(){renderMenu();document.getElementById('menuOverlay').classList.add('open')}
function hurt(n){if(dodgeCd>.45)return;const st=statsCalc();S.hp-=Math.max(1,n-Math.floor(st.d*.35));if(S.hp<=0){S.gold=Math.max(0,S.gold-Math.floor(S.gold*.08));S.hp=S.maxHp;S.mana=S.maxMana;S.x=S.lastShrine.x;S.y=S.lastShrine.y;toast('You were defeated. A little gold was lost.')}save()}
function drawWorld(){ctx.clearRect(0,0,960,540);let cam=Math.max(0,Math.min(2040,S.x-480));ctx.save();ctx.translate(-cam,0);for(const z of zones){ctx.fillStyle=z.color;ctx.fillRect(z.x0,0,z.x1-z.x0,540)}ctx.fillStyle='#a98f62';ctx.fillRect(70,245,2810,52);ctx.fillStyle='#26392f';ctx.fillRect(600,0,32,420);if(!S.secret){ctx.strokeStyle='#ded7ae';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(605,388);ctx.lineTo(625,410);ctx.lineTo(605,432);ctx.stroke()}ctx.fillStyle='#65d8ca';ctx.fillRect(1310,82,22,55);ctx.fillRect(2210,362,22,55);ctx.fillStyle='#dda96e';ctx.fillRect(1030,254,22,30);ctx.fillStyle='#fff';ctx.fillText('Mira',1023,246);ctx.fillStyle='#785744';ctx.fillRect(1197,240,28,45);ctx.fillStyle='#fff';ctx.fillText('Faction Hall',1167,232);ctx.fillStyle='#8dc9a0';ctx.fillRect(1455,73,35,25);ctx.fillStyle='#fff';ctx.fillText('Stable',1452,65);ctx.fillStyle='#789bb4';ctx.fillRect(2835,215,70,90);ctx.fillStyle='#fff';ctx.fillText('Skyship Dock',2828,207);
for(const e of enemies){if(!e.alive)continue;ctx.fillStyle=e.hitT>0?'#fff':(e.type==='knight'?'#6f7185':'#7d9f61');ctx.fillRect(e.x-11,e.y-11,22,22)}for(const b of bosses){if(!b.alive)continue;ctx.fillStyle=b.id==='warden'?'#9b9fac':'#d8f1f7';let s=b.id==='warden'?50:58;ctx.fillRect(b.x-s/2,b.y-s/2,s,s);ctx.fillStyle='#fff';ctx.fillText(b.name,b.x-55,b.y-s/2-10);ctx.fillStyle='#300';ctx.fillRect(b.x-55,b.y-s/2-5,110,5);ctx.fillStyle='#e45';ctx.fillRect(b.x-55,b.y-s/2-5,110*(b.hp/b.max),5)}if(S.mira){ctx.fillStyle='#e5b579';ctx.fillRect(S.x-28,S.y-9,14,18)}ctx.fillStyle='#f3e7c8';ctx.fillRect(S.x-10,S.y-12,20,24);if(S.mount){ctx.strokeStyle='#d8c380';ctx.strokeRect(S.x-14,S.y-16,28,32)}ctx.restore();}
function update(dt){S.playTime+=dt;attackCd=Math.max(0,attackCd-dt);dodgeCd=Math.max(0,dodgeCd-dt);S.mana=Math.min(S.maxMana,S.mana+4*dt);S.stam=Math.min(S.maxStam,S.stam+18*dt);const speed=(S.mount?220+S.mountLevel*20:155)*(S.style==='ranger'?1.05:1);S.x+=jx*speed*dt;S.y+=jy*speed*dt;S.x=Math.max(20,Math.min(2980,S.x));S.y=Math.max(24,Math.min(516,S.y));for(const e of enemies){if(!e.alive)continue;e.hitT=Math.max(0,e.hitT-dt);let d=Math.hypot(S.x-e.x,S.y-e.y);if(d<185){e.x+=(S.x-e.x)/d*(e.type==='knight'?58:44)*dt;e.y+=(S.y-e.y)/d*(e.type==='knight'?58:44)*dt;if(d<28&&Math.random()<.025)hurt(e.type==='knight'?12:7)}}for(const b of bosses){if(!b.alive)continue;let d=Math.hypot(S.x-b.x,S.y-b.y);if(d<250){let sp=b.phase===2?70:48;b.x+=(S.x-b.x)/d*sp*dt;b.y+=(S.y-b.y)/d*sp*dt;if(d<42&&Math.random()<.035)hurt(b.id==='stag'?18:14)}}if(S.mira){for(const e of enemies){if(e.alive&&Math.hypot(S.x-e.x,S.y-e.y)<125&&Math.random()<.012){e.hp-=4+S.level;if(e.hp<=0){e.alive=false;xpGain(8)}}}}if(S.x>900&&S.quest<1)S.quest=1;if(S.mira&&S.quest<2)S.quest=2;if(S.faction&&S.quest<3)S.quest=3;if(S.x>1450&&S.quest<4)S.quest=4;if(S.boss1&&S.quest<5)S.quest=5;factionProgress();if(toastT>0){toastT-=dt;if(toastT<=0)document.getElementById('toast').style.opacity=0}saveThrottle+=dt;if(saveThrottle>5){saveThrottle=0;save()}}
let saveThrottle=0;
function questText(){const q=['Leave Greenwake and reach Briarwatch','Find Mira in Briarwatch','Choose a faction at the Hall','Explore Moonfall Ruins','Defeat the Hollow Warden','Gather Aether Parts and seek Skyreach Pass'][S.quest]||'Explore the Vale';return q}
function frame(t){let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);drawWorld();const st=statsCalc();document.getElementById('stats').innerHTML=`HP ${Math.ceil(S.hp)}/${S.maxHp} · MP ${Math.ceil(S.mana)} · ${S.gold}g<br>Lv ${S.level} · ATK ${st.a} · DEF ${st.d}${S.faction?'<br>'+S.faction+' Rank '+S.factionRep[S.faction]:''}`;document.getElementById('quest').innerHTML=`<b>Main Quest</b><br>${questText()}<br><span class='muted'>Secrets ${S.secret?1:0} · Waystones ${S.waystones.length} · Aether ${S.airshipParts}/3</span>`;requestAnimationFrame(frame)}
function bindTap(id,fn){document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();fn()})}bindTap('atk',hit);bindTap('use',interact);bindTap('dash',()=>{if(dodgeCd<=0&&S.stam>=25){S.stam-=25;dodgeCd=.65;S.x+=jx*95;S.y+=jy*95}});bindTap('menu',openMenu);document.getElementById('closeMenu').onclick=()=>document.getElementById('menuOverlay').classList.remove('open');
const joy=document.getElementById('joy'),knob=document.getElementById('knob');joy.addEventListener('pointerdown',e=>joy.setPointerCapture(e.pointerId));joy.addEventListener('pointermove',e=>{if(!joy.hasPointerCapture(e.pointerId))return;let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1;jx=dx/Math.max(34,m);jy=dy/Math.max(34,m);knob.style.transform=`translate(${jx*34}px,${jy*34}px)`});joy.addEventListener('pointerup',()=>{jx=jy=0;knob.style.transform=''});
document.getElementById('startBtn').onclick=()=>{document.getElementById('start').remove();if(!S.style){document.getElementById('charOverlay').classList.add('open')}else requestAnimationFrame(frame)};document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{S.style=b.dataset.style;if(S.style==='vanguard'){S.maxHp+=15;S.hp=S.maxHp;S.atk+=2}else if(S.style==='ranger'){S.crit=.11;S.atk+=1}else if(S.style==='arcanist'){S.maxMana+=30;S.mana=S.maxMana}else{S.luck=2}save();document.getElementById('charOverlay').classList.remove('open');requestAnimationFrame(frame)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
