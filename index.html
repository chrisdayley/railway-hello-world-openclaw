<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><meta name='theme-color' content='#15251f'><link rel='manifest' href='manifest.webmanifest'><title>Everlight</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1512;color:#fff;font-family:system-ui;touch-action:none}canvas{width:100vw;height:100vh;display:block;background:#274b36;image-rendering:pixelated}.hud{position:fixed;inset:0;pointer-events:none}.p{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;background:#0a1514cc;border:1px solid #a7d5a8;border-radius:8px;padding:8px;font-size:12px}.q{left:auto;right:10px;max-width:42vw;text-align:right}.joy{position:absolute;left:22px;bottom:max(22px,env(safe-area-inset-bottom));width:92px;height:92px;border:2px solid #ffffff44;border-radius:50%;background:#ffffff12;pointer-events:auto}.knob{position:absolute;left:29px;top:29px;width:34px;height:34px;border-radius:50%;background:#ffffff66}.b{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid #a7d5a8;background:#17332dcc;color:#fff;font-weight:700;pointer-events:auto}.atk{right:25px;bottom:30px}.use{right:100px;bottom:18px}.dash{right:98px;bottom:92px}.toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);background:#000c;padding:8px 12px;border-radius:8px;opacity:0}.start{position:fixed;inset:0;background:#0b1512;display:grid;place-items:center;z-index:5}.start button{font-size:24px;padding:18px 28px;border-radius:12px;border:2px solid #e7d58c;background:#264d3d;color:#fff}</style></head><body><div class='start' id='start'><button>START ADVENTURE</button></div><canvas id='g' width='960' height='540'></canvas><div class='hud'><div class='p' id='stats'></div><div class='p q' id='quest'></div><div class='toast' id='toast'></div><div class='joy' id='joy'><div class='knob' id='knob'></div><button class='b atk' id='atk'>ATTACK</button><button class='b use' id='use'>USE</button><button class='b dash' id='dash'>DODGE</button></div><script>const c=g,x=c.getContext('2d'),S={x:180,y:270,hp:100,gold:0,quest:'Reach Briarwatch',secret:false,boss:false,loot:[]},E=[];for(let i=0;i<8;i++)E.push({x:420+Math.random()*900,y:100+Math.random()*340,hp:30});const B={x:1600,y:270,hp:240};let jx=0,jy=0,last=performance.now(),msgT=0;function msg(t){toast.textContent=t;toast.style.opacity=1;msgT=2}function hit(){for(const e of E){if(e.hp>0&&Math.hypot(S.x-e.x,S.y-e.y)<52){e.hp-=15;if(e.hp<=0){S.gold+=5;if(Math.random()<.55){let r=Math.random(),rar=r<.01?'Mythic':r<.05?'Legendary':r<.14?'Epic':r<.34?'Rare':r<.64?'Uncommon':'Common';S.loot.push(rar+' Relic');msg(rar+' loot dropped')}}}}if(B.hp>0&&Math.hypot(S.x-B.x,S.y-B.y)<70){B.hp-=15;if(B.hp<=0){S.boss=true;S.quest='Return to Briarwatch';msg('HOLLOW WARDEN DEFEATED')}}}function use(){if(Math.hypot(S.x-1060,S.y-270)<70){S.quest='Defeat the Hollow Warden';msg('Mira joins you as a companion')}if(Math.hypot(S.x-610,S.y-430)<60&&!S.secret){S.secret=true;S.gold+=40;S.loot.push('Epic Hidden Blade');msg('Hidden chamber discovered!')}if(Math.hypot(S.x-900,S.y-110)<60)msg('Waystone activated — fast travel unlocked')}function draw(){x.clearRect(0,0,960,540);let cam=Math.max(0,Math.min(1240,S.x-480));x.save();x.translate(-cam,0);x.fillStyle='#5c8b55';x.fillRect(0,0,950,540);x.fillStyle='#6e8a5e';x.fillRect(950,0,520,540);x.fillStyle='#59606f';x.fillRect(1470,0,730,540);x.fillStyle='#a18a5e';x.fillRect(80,245,1900,50);x.fillStyle='#2b3e35';x.fillRect(600,0,28,420);if(!S.secret){x.strokeStyle='#d5d0aa';x.beginPath();x.moveTo(605,390);x.lineTo(620,410);x.lineTo(605,430);x.stroke()}x.fillStyle='#62d6c4';x.fillRect(890,92,20,45);x.fillStyle='#e5b579';x.fillRect(1050,255,20,30);x.fillStyle='#fff';x.fillText('Mira',1044,248);for(const e of E){if(e.hp<=0)continue;x.fillStyle='#7b9c5d';x.fillRect(e.x-10,e.y-10,20,20)}if(B.hp>0){x.fillStyle='#9a9faa';x.fillRect(B.x-24,B.y-24,48,48);x.fillStyle='#fff';x.fillText('HOLLOW WARDEN',B.x-52,B.y-34)}x.fillStyle='#f4e8c7';x.fillRect(S.x-10,S.y-12,20,24);x.restore();stats.innerHTML='HP '+S.hp+' · '+S.gold+'g · Loot '+S.loot.length;quest.innerHTML='<b>Main Quest</b><br>'+S.quest+'<br><small>Find cracked walls, waystones, companions and rare loot.</small>'}function step(t){let dt=Math.min(.033,(t-last)/1000);last=t;S.x+=jx*150*dt;S.y+=jy*150*dt;S.x=Math.max(20,Math.min(2180,S.x));S.y=Math.max(20,Math.min(520,S.y));for(const e of E){if(e.hp<=0)continue;let d=Math.hypot(S.x-e.x,S.y-e.y);if(d<150){e.x+=(S.x-e.x)/d*45*dt;e.y+=(S.y-e.y)/d*45*dt}}if(S.x>950&&S.quest==='Reach Briarwatch')S.quest='Find Mira in Briarwatch';if(msgT>0){msgT-=dt;if(msgT<=0)toast.style.opacity=0}draw();requestAnimationFrame(step)}function bindHold(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();fn()})}bindHold(atk,hit);bindHold(use,use);bindHold(dash,()=>{S.x+=jx*80;S.y+=jy*80});joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId)});joy.addEventListener('pointermove',e=>{if(!joy.hasPointerCapture(e.pointerId))return;let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1;jx=dx/Math.max(33,m);jy=dy/Math.max(33,m);knob.style.transform=`translate(${jx*33}px,${jy*33}px)`});joy.addEventListener('pointerup',()=>{jx=jy=0;knob.style.transform=''});document.querySelector('#start button').onclick=()=>{start.remove();requestAnimationFrame(step)};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
